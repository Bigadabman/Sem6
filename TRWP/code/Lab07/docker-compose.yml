services:
  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPass123!"
      MSSQL_PID: "Developer"
    ports:
      - "1437:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

  api:
    image: ${DOCKERHUB_IMAGE:-bigadabman/tdwa07-01}
    build: .
    environment:
      PORT: "3000"
      DB_HOST: "mssql"
      DB_PORT: "1433"
      DB_USER: "sa"
      DB_PASSWORD: "StrongPass123!"
      DB_NAME: "Celebrities"
    ports:
      - "3007:3000"
    depends_on:
      - mssql
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "8087:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mssql_data:
